<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Cuenta Público — Poncitlán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .view-hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="max-w-3xl mx-auto p-4 sm:p-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">Estado de Cuenta Público</h1>
        <p class="text-sm text-gray-500 mb-6">Consulta pública, sin necesidad de iniciar sesión. Actualizado: <span id="vista-generated-at">--</span></p>

        <div id="vista-error" class="view-hidden mb-6 p-4 rounded-lg bg-red-50 text-red-700 text-sm">
            No se pudo cargar la información. Intenta de nuevo más tarde.
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-sm font-medium text-gray-500">Deuda Total Pendiente</h2>
            <p id="vista-total-pendiente" class="text-3xl font-bold text-red-600 mt-1">$0.00</p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-sm font-medium text-gray-500">Arca (disponible)</h2>
            <p id="vista-caja" class="text-3xl font-bold text-green-600 mt-1">$0.00</p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Información Bancaria para Pagos</h2>
            <!-- renderBanco() (src/public-view.ts) renders the CLABE copy
                 button and its success/failure feedback into #vista-banco. -->
            <div id="vista-banco"></div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Ranking de Deudores</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nickname</th>
                            <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Pendiente</th>
                        </tr>
                    </thead>
                    <tbody id="vista-deudores-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="/src/public-view.ts"></script>
</body>
</html>
