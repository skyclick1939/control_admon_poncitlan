schema: spec-driven

context: |
  Tech stack: single-file index.html; Tailwind, Chart.js, @supabase/supabase-js@2 via CDN (ESM)
  Architecture: static site, no build step, no package.json, deployed to Vercel (zero-config)
  Backend: Supabase project "arca" (shared), tables miembros/cargos/registro_apoyos/registro_pagos
  Testing: none today; Vitest planned once the Vite migration lands
  Target: Vite modular JS (no framework), RBAC (superadmin/admin/member), public dashboard, TOTP MFA

strict_tdd: true

testing:
  projects:
    - path: "."
      stack: "Vite + TypeScript, Tailwind (CDN, pending Vite plugin wiring), Chart.js, Supabase JS v2"
      test_command: "vitest run"
      framework: "vitest"
      coverage_command: null
      lint_command: null
      typecheck_command: "tsc --noEmit"
      format_command: null
  fallback_reason: >
    Re-resolved in Phase 1 PR3 (tasks 1.6-1.13) now that the Vite + Vitest
    migration has landed (package.json, tsconfig.json, vite.config.ts from
    PR2). `vitest run` is a real workspace-level test command, so strict_tdd
    flips to true ahead of Phase 2 (roles + MFA) and Phase 3 (public view),
    per tasks.md 1.13's explicit rationale: enforce Vitest before the two
    security-critical phases.

rules:
  proposal:
    - Include a rollback plan for risky changes
    - Scope any Supabase schema/auth change strictly to this app's own tables
      (originally: miembros, cargos, registro_apoyos, registro_pagos; the
      evolucion-plataforma-arca change adds app_admins and
      configuracion_bancaria as app-owned tables under this same rule — see
      design.md). Never touch unrelated tables in the shared "arca" project
      (other arca_* tables, n8n_chat_histories, telegram_whitelist)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document the Vite migration path explicitly (module boundaries, build
      config, Vercel deploy config)
    - Document the RBAC model (superadmin/admin/member) and the TOTP MFA flow
      for superadmin
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Forecast the 400 changed-line review budget; recommend chained PRs per
      delivery_strategy: auto-chain
  apply:
    guidelines:
      - Vite + Vitest are adopted (PR2); strict_tdd is now enforced for every
        task from Phase 2 onward
      - Follow the module boundaries in design.md (features/* import lib/*
        only, never each other)
    tdd: true
    test_command: "vitest run"
  verify:
    test_command: "vitest run"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas, especially schema/auth changes
      on the shared Supabase project
